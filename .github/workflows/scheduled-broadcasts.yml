# Отложенные рассылки: Vercel Cron на Hobby — раз в день, поэтому дёргаем роут отсюда.
# Нужен секрет репозитория CRON_SECRET (тот же, что в переменных Vercel).
name: scheduled-broadcasts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Отправить рассылки, время которых пришло
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::warning::CRON_SECRET не задан в секретах репозитория"; exit 0; fi
          curl -fsS --max-time 310 -H "Authorization: Bearer $CRON_SECRET" \
            https://faravon-cafeteria.vercel.app/api/cron/broadcasts
